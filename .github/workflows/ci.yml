name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Install Playwright Chromium dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: pnpm --filter @remote-agent-console/web exec playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @remote-agent-console/web exec playwright install chromium
      - run: pnpm --filter @remote-agent-console/web test:e2e
